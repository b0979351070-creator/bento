<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>便當外送台 · 工廠團訂</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f1115;--card:#171a20;--card2:#1e222a;--line:#272c36;--txt:#eaeef5;--dim:#8b94a3;
  --org:#ff8a3d;--org2:#ffb46b;--green:#3ddc97;--red:#ff5f6d;--blue:#5aa9ff;--amber:#ffc247}
html,body{margin:0;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.55;
  font-family:-apple-system,"Noto Sans TC","PingFang TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:84px}
.hd{display:flex;align-items:center;gap:10px;padding:15px 16px 8px;position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,var(--bg) 76%,rgba(15,17,21,0))}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#ff8a3d,#ff5f3d);
  display:grid;place-items:center;font-size:19px}
.brand{font-weight:800;font-size:16px}
.brand small{display:block;font-weight:400;font-size:11.5px;color:var(--dim)}
.wrap{padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:12px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 8px}
.sec h2{margin:0;font-size:14px;color:#cfd7e6}
.sec .more{font-size:12px;color:var(--org2)}
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.hero .h{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px;text-align:center}
.hero .h b{display:block;font-size:20px;font-weight:800}
.hero .h span{font-size:11px;color:var(--dim)}
button{font-family:inherit;font-size:14px;border:none;border-radius:11px;padding:11px 14px;background:var(--card2);
  color:var(--txt);font-weight:600;cursor:pointer;transition:transform .06s}
button:active{transform:scale(.97)}
button.pri{background:linear-gradient(135deg,#ff8a3d,#ff5f3d);color:#fff}
button.line{background:transparent;border:1px solid var(--line);color:#c9d2e0}
button.sm{padding:6px 10px;font-size:12px;border-radius:8px}
button.ok{background:rgba(61,220,151,.15);color:var(--green)}
button.warn{background:rgba(255,95,109,.15);color:var(--red)}
input,select,textarea{font-family:inherit;font-size:15px;background:#11141a;border:1px solid var(--line);
  color:var(--txt);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:#3a4557}
label{display:block;font-size:12px;color:var(--dim);margin:10px 0 5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);
  font-size:13px;color:#c3ccdb;white-space:nowrap}
.chip.on{background:rgba(255,138,61,.16);border-color:rgba(255,138,61,.5);color:#ffb98a;font-weight:700}
.cnt{display:flex;align-items:center;justify-content:space-between;background:#11141a;border:1px solid var(--line);
  border-radius:12px;padding:8px 10px;margin-bottom:8px}
.cnt .lb{font-size:14px;font-weight:700}
.cnt .ct{display:flex;align-items:center;gap:10px}
.cnt b{font-size:19px;min-width:34px;text-align:center;color:var(--org2)}
.cnt button{width:38px;height:38px;padding:0;border-radius:10px;font-size:19px;line-height:1;background:var(--card2)}
.o{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid #1e232c;align-items:flex-start}
.o:last-child{border-bottom:none}
.o .tm{font-weight:800;color:var(--org2);font-size:14px;white-space:nowrap;width:52px;flex:0 0 auto}
.o .bd{flex:1;min-width:0}
.o .nm{font-weight:700}
.o .ds{font-size:12.5px;color:var(--dim);margin-top:2px}
.o .q{font-weight:800;font-size:15px;white-space:nowrap}
.bar{height:9px;border-radius:6px;background:#232833;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#ff8a3d,#ffc247)}
.prow{display:flex;justify-content:space-between;font-size:13.5px;margin-top:12px}
.warnbox{background:rgba(255,95,109,.1);border:1px solid rgba(255,95,109,.4);border-radius:12px;padding:11px;margin-top:10px;font-size:13.5px}
.okbox{background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.35);border-radius:12px;padding:11px;margin-top:10px;font-size:13.5px}
.empty{text-align:center;color:var(--dim);font-size:13px;padding:24px 10px}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(18,21,26,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:7px 0 calc(7px + env(safe-area-inset-bottom));z-index:30}
.tabbar button{background:none;border-radius:0;color:var(--dim);font-size:11px;display:flex;flex-direction:column;
  align-items:center;gap:3px;padding:5px 0;font-weight:600}
.tabbar button .ic{font-size:18px;line-height:1}
.tabbar button.on{color:var(--org2)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(12px);background:#262c37;
  border:1px solid #39414f;padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;
  transition:.2s;z-index:99;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.note{font-size:12px;color:var(--dim);line-height:1.6;margin-top:8px}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700}
.t-ok{background:rgba(61,220,151,.15);color:var(--green)}
.t-no{background:rgba(255,194,71,.15);color:var(--amber)}
.t-late{background:rgba(255,95,109,.15);color:var(--red)}
</style>
</head>
<body>
<div class="hd"><div class="logo">🍱</div>
  <div class="brand">便當外送台<small>工廠・公司團訂</small></div></div>

<div class="wrap">
<!-- 接單 -->
<section id="v-order">
  <div class="hero" id="hero"></div>

  <div class="card">
    <div style="font-weight:700;margin-bottom:2px">快速開單</div>
    <div class="note" style="margin:0 0 6px">按數量就好，不用打字</div>
    <label>哪一家</label>
    <div class="chips" id="vchips"></div>
    <div class="grid2" style="margin-top:10px">
      <div><label>日期</label><input id="fDate" type="date"></div>
      <div><label>幾點送到</label><input id="fTime" type="time" value="11:30"></div>
    </div>
    <label>品項（按數量，或貼上訊息）</label>
    <div id="counters"></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <input id="paste" placeholder="貼上：排骨20 雞腿15" style="flex:1">
      <button class="line" data-act="paster">帶入</button>
    </div>
    <label>備註（部門、樓層、聯絡人）</label>
    <input id="fNote" placeholder="例：3F 倉庫 12 個、1F 辦公室 8 個">
    <div class="prow"><span class="note" style="margin:0">合計</span>
      <b id="fTotal" style="color:var(--org2)">0 個</b></div>
    <div class="btns" style="display:flex;gap:8px;margin-top:10px">
      <button class="pri" style="flex:1" data-act="create">建立訂單</button>
      <button class="line" data-act="uselast">帶入上次</button>
      <button class="line" data-act="clear">清除</button>
    </div>
  </div>

  <div class="sec"><h2>訂單</h2><span class="more" id="oday"></span></div>
  <div class="chips" id="dchips" style="margin-bottom:8px"></div>
  <div class="card" id="olist"></div>
</section>

<!-- 生產 -->
<section id="v-prod" style="display:none">
  <div class="sec"><h2>廚房生產單</h2><span class="more" id="pdate"></span></div>
  <div class="chips" id="pdchips" style="margin-bottom:8px"></div>
  <div class="card" id="psum"></div>
  <div class="sec"><h2>時程（依送達時間反推）</h2></div>
  <div class="card" id="psched"></div>
  <div class="sec"><h2>打 POS 後對帳</h2></div>
  <div class="card">
    <div class="note" style="margin:0 0 8px">打完 POS 後，輸入 POS 上的總個數，系統幫你對。</div>
    <div class="grid2">
      <div><label>POS 上的總個數</label><input id="posQty" type="number" inputmode="numeric" placeholder="0"></div>
      <div><label>便當單價</label><input id="unitPrice" type="number" inputmode="numeric" value="75"></div>
    </div>
    <button class="pri" style="width:100%;margin-top:10px" data-act="check">核對</button>
    <div id="checkOut"></div>
  </div>
</section>

<!-- 配送 -->
<section id="v-ship" style="display:none">
  <div class="sec"><h2>配送單</h2><span class="more" id="sdate"></span></div>
  <div class="chips" id="sdchips" style="margin-bottom:8px"></div>
  <div class="card">
    <div class="note" style="margin:0 0 8px">依送達時間排序，外送員照這張跑。</div>
    <div class="btns" style="display:flex;gap:8px">
      <button class="pri" style="flex:1" data-act="shipcopy">複製配送單</button>
    </div>
  </div>
  <div id="shiplist"></div>
</section>

<section id="v-hist" style="display:none">
  <div class="sec"><h2>每家公司的紀錄</h2><span class="more">近 30 天</span></div>
  <div id="histlist"></div>
  <div class="card"><div class="note" style="margin:0 0 9px">月結、請款、談生意都用得到。</div>
    <button class="line" style="width:100%" data-act="csvall">匯出全部訂單 CSV</button></div>
  <div class="card"><div class="note" style="margin:0 0 9px">換手機、換網址前先備份。還原時把檔案選回來就好。</div>
    <div class="btns" style="display:flex;gap:8px">
      <button class="line" style="flex:1" data-act="jsonall">備份全部資料</button>
      <button class="line" style="flex:1" data-act="jsonimp">還原備份</button>
    </div>
    <input type="file" id="impfile" accept=".json,application/json" style="display:none"></div>
</section>
</div>

<div class="tabbar">
  <button class="on" data-act="tab" data-tab="order"><span class="ic">📝</span>接單</button>
  <button data-act="tab" data-tab="prod"><span class="ic">🍳</span>生產</button>
  <button data-act="tab" data-tab="ship"><span class="ic">🛵</span>配送</button>
  <button data-act="tab" data-tab="hist"><span class="ic">📊</span>記錄</button>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= PURE ================= */
const KEY='bento_v1';
const MAINS=['排骨','雞腿','魚排','爌肉','素食','雞排'];
const PRICE=75;

function money(n){ return '$'+Math.round(n||0).toLocaleString('en-US'); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad(n){ return String(n).padStart(2,'0'); }
function dayStr(d){ d=d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addDays(s,n){ const a=s.split('-'); const d=new Date(+a[0],+a[1]-1,+a[2]); d.setDate(d.getDate()+n); return dayStr(d); }
function md(s){ return s? s.slice(5).replace('-','/'):''; }

/* 貼上文字 → [{m,q}]：支援「排骨20」「排骨*20」「排骨x20 雞腿15」 */
function parseItems(txt){
  const t=String(txt).replace(/[，,、;；]/g,' ');
  const out=[]; const re=new RegExp('('+MAINS.join('|')+')\\s*[xX*×:：]?\\s*(\\d{1,3})','g');
  let m;
  while((m=re.exec(t))){ out.push({m:m[1], q:+m[2]}); }
  return out;
}
function sumQty(items){ return items.reduce((s,i)=>s+i.q,0); }

function ordersOf(orders, date){ return orders.filter(o=>o.date===date); }

function prodSummary(os){
  const map={};
  os.forEach(o=>o.items.forEach(i=>{ map[i.m]=(map[i.m]||0)+i.q; }));
  const rows=MAINS.filter(m=>map[m]).map(m=>({m, q:map[m]}));
  return {rows, total:rows.reduce((s,r)=>s+r.q,0)};
}

/* 每家一個配送點，同一天同一家合併 */
function shipList(os, vendors){
  const map={};
  os.forEach(o=>{
    const v=vendors.find(x=>x.id===o.vid)||{name:'未指定',phone:'',addr:''};
    const k=o.vid;
    if(!map[k]) map[k]={vid:k,name:v.name,phone:v.phone,addr:v.addr,due:o.due,items:[],notes:[]};
    o.items.forEach(i=>{
      const f=map[k].items.find(x=>x.m===i.m);
      if(f) f.q+=i.q; else map[k].items.push({m:i.m,q:i.q});
    });
    if(o.note) map[k].notes.push(o.note);
    if(o.due<map[k].due) map[k].due=o.due;
  });
  return Object.values(map).sort((a,b)=>a.due.localeCompare(b.due));
}

/* 每 10 個便當約 12 分鐘，加 10 分鐘裝箱緩衝 */
function latestStart(due, qty, per10, buffer){
  per10=per10||12; buffer=buffer==null?10:buffer;
  const a=due.split(':'); let mins=+a[0]*60+ +a[1];
  mins -= Math.ceil(qty/10)*per10 + buffer;
  mins = Math.max(0, mins);
  return pad(Math.floor(mins/60))+':'+pad(mins%60);
}
function schedule(os, vendors){
  return shipList(os,vendors).map(s=>({
    name:s.name, due:s.due, qty:sumQty(s.items), start:latestStart(s.due, sumQty(s.items))
  })).sort((a,b)=>a.start.localeCompare(b.start));
}
/* 兩家最晚開始時間相差不到 15 分鐘 → 視為撞車 */
function conflicts(sc){
  const out=[];
  for(let i=0;i<sc.length-1;i++){
    const a=sc[i], b=sc[i+1];
    const m1=+a.start.slice(0,2)*60+ +a.start.slice(3), m2=+b.start.slice(0,2)*60+ +b.start.slice(3);
    if(Math.abs(m2-m1)<15) out.push([a,b]);
  }
  return out;
}
function reconcile(os, posQty, unitPrice){
  const total=os.reduce((s,o)=>s+sumQty(o.items),0);
  const diff=posQty-total;
  return {total, diff, expectAmount:total*(unitPrice||PRICE), actualAmount:posQty*(unitPrice||PRICE), ok:diff===0};
}
function shipText(list, date){
  if(!list.length) return '';
  let s='【'+md(date)+' 便當配送單】\n';
  list.forEach((v,i)=>{
    s+=(i+1)+'. '+v.due+' '+v.name+'　'+sumQty(v.items)+' 個\n';
    s+='　　'+v.items.map(x=>x.m+'×'+x.q).join('、')+'\n';
    if(v.addr) s+='　　'+v.addr+'\n';
    if(v.phone) s+='　　☎ '+v.phone+'\n';
    if(v.notes.length) s+='　　註：'+v.notes.join('；')+'\n';
  });
  return s.trim();
}
function prodText(ps, date){
  let s='【'+md(date)+' 生產單】\n';
  ps.rows.forEach(r=>{ s+=r.m+'　'+r.q+' 個\n'; });
  s+='────────\n合計 '+ps.total+' 個（白飯 '+ps.total+' 碗）';
  return s;
}
function vendorStats(orders, vendors, days){
  const cut=addDays(dayStr(), -(days||30));
  return vendors.map(v=>{
    const os=orders.filter(o=>o.vid===v.id && o.date>=cut);
    const qty=os.reduce((s,o)=>s+sumQty(o.items),0);
    const cnt={};
    os.forEach(o=>o.items.forEach(i=>{cnt[i.m]=(cnt[i.m]||0)+i.q;}));
    const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,3).map(m=>({m,q:cnt[m]}));
    const last=os.map(o=>o.date).sort().pop()||'';
    return {id:v.id,name:v.name,n:os.length,qty,avg:os.length?Math.round(qty/os.length):0,top,last};
  }).sort((a,b)=>b.qty-a.qty);
}
function csvAll(orders, vendors){
  const rows=[['日期','公司','品項','數量','金額']];
  orders.slice().sort((a,b)=>(a.date+a.due).localeCompare(b.date+b.due)).forEach(o=>{
    const v=vendors.find(x=>x.id===o.vid)||{name:''};
    o.items.forEach(i=>rows.push([o.date, v.name, i.m, i.q, i.q*PRICE]));
  });
  return rows.map(r=>r.join(',')).join('\n');
}
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function lateBy(start){ const m=+start.slice(0,2)*60 + +start.slice(3); return nowMin()-m; }
/* =============== END PURE =============== */

let DB=load();
function load(){ try{const r=localStorage.getItem(KEY); if(r){const d=JSON.parse(r); if(d&&d.orders) return d;}}catch(e){} return SEED(); }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){} }
save();

function SEED(){
  const t=dayStr();
  const vendors=[
    {id:'v1',name:'大同電子',phone:'04-2233-1188',addr:'台中市北屯區文心路 88 號'},
    {id:'v2',name:'信昌五金',phone:'04-2244-5566',addr:'台中市北區崇德路 120 號'},
    {id:'v3',name:'立群紡織',phone:'04-2255-7788',addr:'台中市西屯區中科路 5 號'},
    {id:'v4',name:'宏達食品',phone:'04-2266-9900',addr:'台中市南屯區工業區 22 路 9 號'}
  ];
  const orders=[
    {id:uid(),vid:'v1',date:t,due:'11:30',items:[{m:'排骨',q:22},{m:'雞腿',q:8}],note:'3F 倉庫 18、1F 辦公室 12',done:false},
    {id:uid(),vid:'v2',date:t,due:'11:50',items:[{m:'雞腿',q:12},{m:'素食',q:3}],note:'',done:false},
    {id:uid(),vid:'v3',date:t,due:'12:10',items:[{m:'爌肉',q:15},{m:'魚排',q:5}],note:'分兩梯，第二梯 12:40',done:false},
    {id:uid(),vid:'v4',date:addDays(t,1),due:'11:00',items:[{m:'排骨',q:30},{m:'雞排',q:10}],note:'尾牙前提前',done:false}
  ];
  return {vendors, orders, ver:1};
}

let TAB='order', VDATE=dayStr(), PDATE=dayStr(), QTY={}, VID=(DB.vendors[0]||{}).id;
const $=s=>document.querySelector(s);
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
let tT; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('on'),1700); }
function download(name,txt,type){
  const b=new Blob(['\ufeff'+txt],{type:type||'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},400);
}
function copy(txt){ if(!txt) return toast('沒有內容');
  const done=()=>toast('已複製');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(fb); else fb();
  function fb(){ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');done();}catch(e){toast('複製失敗');} ta.remove(); } }

/* ---------- 接單 ---------- */
function renderOrder(){
  const today=dayStr();
  const os=DB.orders.filter(o=>o.date===VDATE);
  const tq=os.reduce((s,o)=>s+sumQty(o.items),0);
  const tv=new Set(os.map(o=>o.vid)).size;
  const tm=os.reduce((s,o)=>s+sumQty(o.items)*PRICE,0);
  $('#hero').innerHTML=
    `<div class="h"><b style="color:var(--org2)">${tq}</b><span>${VDATE===today?'今天':'當日'}個便當</span></div>`+
    `<div class="h"><b>${os.length}</b><span>單（${tv} 家）</span></div>`+
    `<div class="h"><b style="color:var(--green)">${money(tm)}</b><span>金額</span></div>`;

  $('#vchips').innerHTML=DB.vendors.map(v=>
    `<div class="chip ${v.id===VID?'on':''}" data-act="vid" data-id="${v.id}">${esc(v.name)}</div>`).join('')+
    `<div class="chip" data-act="addvendor">＋ 新客戶</div>`;

  $('#counters').innerHTML=MAINS.map(m=>`
    <div class="cnt"><span class="lb">${m}</span>
      <span class="ct"><button data-act="dec" data-m="${m}">−</button>
      <b id="q-${m}">${QTY[m]||0}</b>
      <button data-act="inc" data-m="${m}">＋</button></span></div>`).join('');
  $('#fTotal').textContent=sumQty(Object.keys(QTY).map(m=>({m,q:QTY[m]||0})))+' 個';

  const days=[today,addDays(today,1),addDays(today,2)];
  $('#dchips').innerHTML=days.map(d=>
    `<div class="chip ${d===VDATE?'on':''}" data-act="vdate" data-d="${d}">${d===today?'今天':d===addDays(today,1)?'明天':md(d)}</div>`).join('');
  $('#oday').textContent=md(VDATE)+' · '+os.length+' 單';

  const list=os.slice().sort((a,b)=>a.due.localeCompare(b.due));
  $('#olist').innerHTML=list.length?list.map(o=>{
    const v=DB.vendors.find(x=>x.id===o.vid)||{name:'未指定'};
    return `<div class="o">
      <div class="tm">${esc(o.due)}</div>
      <div class="bd"><div class="nm">${esc(v.name)} ${o.done?'<span class="tag t-ok">已出</span>':''}</div>
        <div class="ds">${o.items.map(i=>i.m+'×'+i.q).join('、')}</div>
        ${o.note?`<div class="ds" style="color:#a9b4c6">${esc(o.note)}</div>`:''}
        <div style="margin-top:6px;display:flex;gap:6px">
          <button class="sm ${o.done?'ok':'line'}" data-act="done" data-id="${o.id}">${o.done?'取消完成':'標記完成'}</button>
          <button class="sm line" data-act="del" data-id="${o.id}">刪除</button>
        </div></div>
      <div class="q">${sumQty(o.items)}<span style="font-size:11px;color:var(--dim)"> 個</span></div>
    </div>`;
  }).join(''):'<div class="empty">這天還沒有訂單</div>';
}

/* ---------- 生產 ---------- */
function dateChips(cur){
  const t=dayStr(), ds=[t,addDays(t,1),addDays(t,2)];
  return ds.map(d=>`<div class="chip ${d===cur?'on':''}" data-act="pdate" data-d="${d}">${d===t?'今天':d===addDays(t,1)?'明天':md(d)}</div>`).join('');
}
function renderProd(){
  const os=ordersOf(DB.orders, PDATE);
  const ps=prodSummary(os);
  $('#pdate').textContent=md(PDATE);
  $('#pdchips').innerHTML=dateChips(PDATE);
  const max=Math.max(1,...ps.rows.map(r=>r.q));
  $('#psum').innerHTML=ps.rows.length?`
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <div><div class="note" style="margin:0">總便當數</div>
        <div style="font-size:30px;font-weight:800;color:var(--org2)">${ps.total}</div></div>
      <button class="line sm" data-act="prodcopy">複製生產單</button>
    </div>
    <div style="height:1px;background:#1e232c;margin:10px 0"></div>
    ${ps.rows.map(r=>`<div style="margin-top:10px">
      <div style="display:flex;justify-content:space-between;font-size:14px"><span>${r.m}</span><b>${r.q}</b></div>
      <div class="bar"><i style="width:${Math.round(r.q/max*100)}%"></i></div></div>`).join('')}
    <div class="note">白飯 ${ps.total} 碗 · 每份 3 菜</div>`
    :'<div class="empty">這天沒有訂單</div>';

  const sc=schedule(os, DB.vendors);
  const cf=conflicts(sc);
  $('#psched').innerHTML=sc.length?sc.map(s=>{
    const lm=lateBy(s.start);
    const tag = lm>0 ? `<span class="tag t-late">已超過 ${lm} 分</span>`
              : lm>-30 ? `<span class="tag t-no">剩 ${-lm} 分</span>`
              : `<span class="tag t-ok">剩 ${-lm} 分</span>`;
    return `<div class="o">
      <div class="tm" style="color:${lm>0?'var(--red)':'var(--org2)'}">${s.start}</div>
      <div class="bd"><div class="nm">${esc(s.name)} ${tag}</div>
        <div class="ds">${s.qty} 個 · ${s.due} 前送到</div></div>
      <div class="q" style="color:var(--dim);font-size:11px;text-align:right;line-height:1.3">最晚<br>開始</div>
    </div>`;
  }).join('')+(cf.length?`<div class="warnbox">⚠️ ${cf.map(c=>esc(c[0].name)+' 與 '+esc(c[1].name)).join('、')} 的開始時間太近，可能做不出來。考慮提前或分批。</div>`:'')
   :'<div class="empty">沒有排程</div>';
}

/* ---------- 配送 ---------- */
function renderShip(){
  const os=ordersOf(DB.orders, PDATE);
  const list=shipList(os, DB.vendors);
  $('#sdate').textContent=md(PDATE)+' · '+list.length+' 家';
  $('#sdchips').innerHTML=dateChips(PDATE);
  $('#shiplist').innerHTML=list.length?list.map((v,i)=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div><div style="font-weight:800;font-size:16px">${i+1}. ${esc(v.name)}</div>
          <div class="note" style="margin:2px 0 0">${esc(v.addr||'—')}</div></div>
        <div style="text-align:right"><div style="font-size:22px;font-weight:800;color:var(--org2)">${sumQty(v.items)}</div>
          <div class="note" style="margin:0">個</div></div>
      </div>
      <div style="margin-top:8px;font-size:13.5px">${v.items.map(x=>x.m+' × '+x.q).join('　')}</div>
      ${v.notes.length?`<div class="note">註：${esc(v.notes.join('；'))}</div>`:''}
      <div style="display:flex;gap:8px;margin-top:10px">
        <div class="chip" style="flex:1;text-align:center">${esc(v.due)} 前送到</div>
        ${v.phone?`<a href="tel:${esc(v.phone)}" style="flex:1;text-decoration:none"><div class="chip" style="text-align:center">☎ ${esc(v.phone)}</div></a>`:''}
      </div>
    </div>`).join(''):'<div class="card empty">這天沒有配送</div>';
}

function renderHist(){
  const st=vendorStats(DB.orders, DB.vendors, 30);
  $('#histlist').innerHTML=st.length?st.map(v=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <div style="font-weight:800;font-size:15.5px">${esc(v.name)}</div>
        <div style="font-size:19px;font-weight:800;color:var(--org2)">${v.qty}<span style="font-size:11.5px;color:var(--dim)"> 個 / 30天</span></div>
      </div>
      <div class="note" style="margin:4px 0 0">${v.n} 次 · 平均 ${v.avg} 個 · 最後 ${v.last?md(v.last):'—'}</div>
      ${v.top.length?`<div style="margin-top:8px;font-size:13px;color:#c3ccdb">常點：${v.top.map(t=>t.m+' × '+t.q).join('、')}</div>`:''}
    </div>`).join(''):'<div class="empty">還沒有紀錄</div>';
}

function render(){
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB));
  ['order','prod','ship','hist'].forEach(t=>$('#v-'+t).style.display = t===TAB?'':'none');
  if(TAB==='order') renderOrder();
  if(TAB==='prod') renderProd();
  if(TAB==='ship') renderShip();
  if(TAB==='hist') renderHist();
}

document.addEventListener('click', function(e){
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a==='tab'){ TAB=el.dataset.tab; render(); window.scrollTo(0,0); return; }
  if(a==='vid'){ VID=el.dataset.id; render(); return; }
  if(a==='addvendor'){ const n=prompt('新客戶名稱'); if(n){ const v={id:uid(),name:n,phone:'',addr:''};
    DB.vendors.push(v); VID=v.id; save(); render(); } return; }
  if(a==='inc'||a==='dec'){ const m=el.dataset.m; QTY[m]=Math.max(0,(QTY[m]||0)+(a==='inc'?1:-1)); render(); return; }
  if(a==='vdate'){ VDATE=el.dataset.d; $('#fDate').value=VDATE; render(); return; }
  if(a==='paster'){
    const items=parseItems($('#paste').value);
    if(!items.length) return toast('看不出品項，用按的比較快');
    QTY={}; items.forEach(i=>{ QTY[i.m]=(QTY[i.m]||0)+i.q; });
    $('#paste').value=''; render(); toast('已帶入 '+sumQty(items)+' 個'); return;
  }
  if(a==='clear'){ QTY={}; $('#fNote').value=''; render(); return; }
  if(a==='create'){
    const items=Object.keys(QTY).map(m=>({m,q:QTY[m]})).filter(i=>i.q>0);
    if(!items.length) return toast('數量都是 0');
    DB.orders.unshift({id:uid(),vid:VID,date:$('#fDate')?$('#fDate').value||VDATE:VDATE,
      due:$('#fTime').value||'11:30',items,note:$('#fNote').value.trim(),done:false});
    save(); QTY={}; $('#fNote').value=''; toast('已建立 '+sumQty(items)+' 個'); render(); return;
  }
  if(a==='done'){ const o=DB.orders.find(x=>x.id===el.dataset.id); o.done=!o.done; save(); render(); return; }
  if(a==='del'){ DB.orders=DB.orders.filter(x=>x.id!==el.dataset.id); save(); render(); return; }
  if(a==='pdate'){ PDATE=el.dataset.d; render(); return; }
  if(a==='uselast'){
    let prev=DB.orders.filter(o=>o.vid===VID && o.date<VDATE).sort((x,y)=>y.date.localeCompare(x.date))[0];
    if(!prev) prev=DB.orders.filter(o=>o.vid===VID).sort((x,y)=>y.date.localeCompare(x.date))[0];
    if(!prev) return toast('這家還沒有任何單');
    QTY={}; prev.items.forEach(i=>{ QTY[i.m]=i.q; });
    $('#fTime').value=prev.due; $('#fNote').value=prev.note||'';
    render(); toast('已帶入 '+md(prev.date)+' 的單'); return;
  }
  if(a==='jsonall'){
    const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
    const url=URL.createObjectURL(blob), el=document.createElement('a');
    el.href=url; el.download='便當台備份-'+dayStr()+'.json';
    document.body.appendChild(el); el.click(); el.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast('已備份 '+DB.orders.length+' 筆'); return;
  }
  if(a==='jsonimp'){ $('#impfile').click(); return; }
  if(a==='csvall'){ download('便當訂單-'+dayStr()+'.csv', csvAll(DB.orders, DB.vendors)); return; }
  if(a==='prodcopy'){ copy(prodText(prodSummary(ordersOf(DB.orders,PDATE)), PDATE)); return; }
  if(a==='shipcopy'){ copy(shipText(shipList(ordersOf(DB.orders,PDATE),DB.vendors), PDATE)); return; }
  if(a==='check'){
    const os=ordersOf(DB.orders,PDATE);
    const pq=+$('#posQty').value||0, up=+$('#unitPrice').value||PRICE;
    const r=reconcile(os,pq,up);
    $('#checkOut').innerHTML = r.ok
      ? `<div class="okbox">✅ 對上了：${r.total} 個，${money(r.actualAmount)}</div>`
      : `<div class="warnbox">⚠️ 對不上：系統 ${r.total} 個，POS ${pq} 個，差 ${r.diff>0?'+':''}${r.diff} 個
         （差 ${money(Math.abs(r.diff*up))}）<br>先查是不是漏打、或數量打錯。</div>`;
    return;
  }
});

$('#fDate').value=dayStr();
const impEl=document.getElementById('impfile');
if(impEl) impEl.addEventListener('change', function(e){
  const f=e.target.files && e.target.files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=function(){
    try{
      const d=JSON.parse(fr.result);
      if(!d || !Array.isArray(d.orders)) throw new Error('bad');
      DB=d; if(!DB.vendors || !DB.vendors.length) DB.vendors=SEED().vendors;
      save(); render(); toast('已還原 '+DB.orders.length+' 筆');
    }catch(err){ toast('檔案格式不對'); }
    e.target.value='';
  };
  fr.readAsText(f);
});

render();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
